[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API primeiro — redirects são avaliados em ordem, e o catch-all do SPA logo
# abaixo (/* -> index.html) capturaria essas rotas antes das functions se
# viesse primeiro.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Existing hashed assets are served directly by Netlify. If an old PWA asks
# for a hash removed by a newer deploy, return a valid JavaScript recovery
# module. Its side effect reloads even clients that predate lazyWithRetry.
[[redirects]]
  from = "/assets/*"
  to = "/chunk-recovery.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/chunk-recovery.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/conta-fechada.apk"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=Conta-Fechada.apk"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
